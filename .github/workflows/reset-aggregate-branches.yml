name: Align aggregate submodules to their matching branch

on:
  # Recheck branch refs and aggregate gitlinks regularly. The parent gitlink
  # must match the child repository head on the same branch name.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:

permissions:
  contents: read
  actions: read

concurrency:
  group: reset-aggregate-integration-branches
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Align dev and staging submodule refs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node workers/automate/scripts/reset-integration-branches.mjs --apply
