name: GitHub Manager Runner

on:
  workflow_dispatch:
    inputs:
      operations_json:
        description: JSON com dry_run e operations[]; vazio executa a auditoria gerencial
        required: false
        type: string
      dry_run:
        description: Forca dry_run quando true
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# PAUSA CTO ControleOnline/agents-mcp#201 (2026-08-29)
# Reativacao pontual autorizada pelo mantenedor em ControleOnline/agents-mcp#201.
# O push abaixo executa somente a requisicao versionada do GitHub Manager e sera removido apos a verificacao.
  push:
    branches:
      - master
    paths:
      - workers/automate/requests/github-manager.json

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  github-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run GitHub manager
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_OPS_DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          OPERATIONS_JSON: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operations_json || '' }}
          OPERATIONS_FILE: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !github.event.inputs.operations_json)) && 'workers/automate/requests/github-manager.json' || '' }}
          GITHUB_MANAGER_ALLOWED_LOGINS: luizkim,github-copilot[bot],copilot-swe-agent,copilot
          GITHUB_MANAGER_PROJECT_ORG: ControleOnline
          GITHUB_MANAGER_PROJECT_NUMBER: 1
          GITHUB_MANAGER_WORK_STATUSES: Ready,Working
          GITHUB_MANAGER_IN_REVIEW_STATUSES: In Review
          GITHUB_MANAGER_DONE_STATUSES: Done
          GITHUB_MANAGER_AGENT_LABELS: agent:developer,agent:security,agent:devops,agent:sysadmin
          GITHUB_MANAGER_OUTPUT_DIR: /tmp
        run: node workers/automate/scripts/github-operations.mjs

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: github-manager-runner
          path: /tmp/github-operations.json
          if-no-files-found: ignore
