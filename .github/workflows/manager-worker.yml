name: Manager Worker

on:
  push:
    branches: [master, main, dev, staging]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  resolve:
    name: Manager — resolve/create issue
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.mgr.outputs.issue_number }}
      created: ${{ steps.mgr.outputs.created }}
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Branch name
        id: branch
        run: echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Manager subworker
        id: mgr
        uses: ./.github/actions/workers/manager
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          branch: ${{ steps.branch.outputs.name }}

  # ─── dev: QA + Security em paralelo ───────────────────────────
  qa:
    name: QA worker
    needs: resolve
    if: needs.resolve.outputs.branch == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workers/qa
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          issue_number: ${{ needs.resolve.outputs.issue_number }}
          base_branch: dev

  security:
    name: Security worker
    needs: resolve
    if: needs.resolve.outputs.branch == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workers/security
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          issue_number: ${{ needs.resolve.outputs.issue_number }}
          base_branch: dev

  # ─── staging: QA + Security em paralelo ───────────────────────
  qa-staging:
    name: QA worker (staging)
    needs: resolve
    if: needs.resolve.outputs.branch == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workers/qa
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          issue_number: ${{ needs.resolve.outputs.issue_number }}
          base_branch: staging

  security-staging:
    name: Security worker (staging)
    needs: resolve
    if: needs.resolve.outputs.branch == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workers/security
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          issue_number: ${{ needs.resolve.outputs.issue_number }}
          base_branch: staging

  # ─── master/main: Technical Documenter ────────────────────────
  technical-documenter:
    name: Technical Documenter worker
    needs: resolve
    if: needs.resolve.outputs.branch == 'master' || needs.resolve.outputs.branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workers/technical-documenter
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          issue_number: ${{ needs.resolve.outputs.issue_number }}
          base_branch: ${{ needs.resolve.outputs.branch }}

  # ─── master/main: se faltar alguma das 4 validações → tags + workers ───
  master-gates:
    name: Master gates (quarteto)
    needs: resolve
    if: needs.resolve.outputs.branch == 'master' || needs.resolve.outputs.branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      need_qa: ${{ steps.check.outputs.need_qa }}
      need_security: ${{ steps.check.outputs.need_security }}
      need_docs: ${{ steps.check.outputs.need_docs }}
      need_tutorial: ${{ steps.check.outputs.need_tutorial }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect quarteto labels
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE: ${{ needs.resolve.outputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LABELS=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
          echo "Labels atuais: $LABELS"

          need_qa=false
          need_security=false
          need_docs=false
          need_tutorial=false

          echo "$LABELS" | grep -q 'qa:accepted' || need_qa=true
          echo "$LABELS" | grep -q 'security:accepted' || need_security=true
          echo "$LABELS" | grep -q 'agent:technical-documenter:done' || need_docs=true
          echo "$LABELS" | grep -q 'agent:tutorial-assistant:done' || need_tutorial=true

          echo "need_qa=$need_qa" >> "$GITHUB_OUTPUT"
          echo "need_security=$need_security" >> "$GITHUB_OUTPUT"
          echo "need_docs=$need_docs" >> "$GITHUB_OUTPUT"
          echo "need_tutorial=$need_tutorial" >> "$GITHUB_OUTPUT"

          # tags de fila quando faltarem gates
          if [ "$need_qa" = true ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --add-label "agent:qa" || true
          fi
          if [ "$need_security" = true ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --add-label "agent:security" || true
          fi
          if [ "$need_docs" = true ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --add-label "agent:technical-documenter" || true
          fi
          if [ "$need_tutorial" = true ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --add-label "agent:tutorial-assistant" || true
          fi

          gh issue comment "$ISSUE" --repo "$REPO" --body \
            "Master gates: need_qa=$need_qa need_security=$need_security need_docs=$need_docs need_tutorial=$need_tutorial. Workers serão disparados para o que faltar."

  master-qa:
    name: QA (master gap)
    needs: [resolve, master-gates]
    if: |
      (needs.resolve.outputs.branch == 'master' || needs.resolve.outputs.branch == 'main') &&
      needs.master-gates.outputs.need_qa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workers/qa
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          issue_number: ${{ needs.resolve.outputs.issue_number }}
          base_branch: ${{ needs.resolve.outputs.branch }}

  master-security:
    name: Security (master gap)
    needs: [resolve, master-gates]
    if: |
      (needs.resolve.outputs.branch == 'master' || needs.resolve.outputs.branch == 'main') &&
      needs.master-gates.outputs.need_security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workers/security
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          issue_number: ${{ needs.resolve.outputs.issue_number }}
          base_branch: ${{ needs.resolve.outputs.branch }}

  master-docs-gap:
    name: Technical Documenter (master gap)
    needs: [resolve, master-gates, technical-documenter]
    if: |
      always() &&
      (needs.resolve.outputs.branch == 'master' || needs.resolve.outputs.branch == 'main') &&
      needs.master-gates.outputs.need_docs == 'true' &&
      needs.technical-documenter.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/workers/technical-documenter
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          issue_number: ${{ needs.resolve.outputs.issue_number }}
          base_branch: ${{ needs.resolve.outputs.branch }}
